<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Weather Now | Week 3 Project</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      body {
        min-height: 100vh;

        /* Cool modern background */
        background:
          radial-gradient(circle at top left, #4f46e5 0%, transparent 35%),
          radial-gradient(circle at bottom right, #06b6d4 0%, transparent 35%),
          linear-gradient(135deg, #0f172a, #172554, #164e63);

        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }

      .container {
        width: 100%;
        max-width: 850px;
        text-align: center;
      }

      /* Header */
      .header {
        margin-bottom: 30px;
      }

      .weather-logo {
        font-size: 60px;
        margin-bottom: 5px;
        animation: float 3s ease-in-out infinite;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }

        50% {
          transform: translateY(-8px);
        }
      }

      h1 {
        font-size: 48px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .subtitle {
        font-size: 18px;
        margin-top: 8px;
        color: #cbd5e1;
      }

      /* Search Box */
      .search-box {
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        padding: 20px;
        border-radius: 22px;

        display: flex;
        gap: 12px;

        border: 1px solid rgba(255, 255, 255, 0.2);

        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);

        margin-bottom: 25px;
      }

      #cityInput {
        flex: 1;
        padding: 16px 18px;

        border: none;
        outline: none;

        border-radius: 14px;

        font-size: 17px;

        background: rgba(255, 255, 255, 0.95);
        color: #0f172a;
      }

      #cityInput:focus {
        box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.4);
      }

      #searchBtn {
        border: none;
        padding: 0 25px;

        border-radius: 14px;

        background: linear-gradient(135deg, #06b6d4, #3b82f6);

        color: white;
        font-size: 16px;
        font-weight: 600;

        cursor: pointer;

        transition: 0.3s;
      }

      #searchBtn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(6, 182, 212, 0.35);
      }

      #searchBtn:active {
        transform: scale(0.97);
      }

      /* Loading */
      #loading {
        display: none;
        margin: 20px;
        font-size: 17px;
        color: #bae6fd;
      }

      /* Error */
      #error {
        display: none;

        background: rgba(239, 68, 68, 0.15);

        border: 1px solid rgba(248, 113, 113, 0.5);

        color: #fecaca;

        padding: 15px;

        border-radius: 14px;

        margin-bottom: 20px;
      }

      /* Weather Card */
      #weatherCard {
        display: none;

        background: rgba(255, 255, 255, 0.12);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        border: 1px solid rgba(255, 255, 255, 0.2);

        border-radius: 25px;

        padding: 30px;

        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);

        animation: appear 0.5s ease;
      }

      @keyframes appear {
        from {
          opacity: 0;
          transform: translateY(20px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .location {
        font-size: 30px;
        font-weight: 600;
      }

      .date {
        color: #cbd5e1;
        margin-top: 5px;
        font-size: 14px;
      }

      .weather-main {
        margin: 25px 0;
      }

      #weatherIcon {
        width: 120px;
        height: 120px;
      }

      #temperature {
        font-size: 60px;
        font-weight: 700;
      }

      #condition {
        font-size: 22px;
        text-transform: capitalize;
        color: #bae6fd;
        margin-top: 5px;
      }

      /* Weather Information */
      .weather-info {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;

        margin-top: 25px;
      }

      .info-card {
        background: rgba(255, 255, 255, 0.1);

        padding: 20px;

        border-radius: 18px;

        transition: 0.3s;
      }

      .info-card:hover {
        transform: translateY(-4px);
        background: rgba(255, 255, 255, 0.16);
      }

      .info-icon {
        font-size: 28px;
      }

      .info-title {
        color: #cbd5e1;
        font-size: 14px;
        margin-top: 5px;
      }

      .info-value {
        font-size: 20px;
        font-weight: 600;
        margin-top: 5px;
      }

      /* Footer */
      footer {
        margin-top: 25px;
        color: #94a3b8;
        font-size: 14px;
      }

      /* Mobile */
      @media (max-width: 600px) {
        body {
          padding: 20px;
        }

        h1 {
          font-size: 36px;
        }

        .weather-logo {
          font-size: 45px;
        }

        .search-box {
          flex-direction: column;
        }

        #searchBtn {
          padding: 15px;
        }

        .weather-info {
          grid-template-columns: 1fr;
        }

        #temperature {
          font-size: 50px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <div class="weather-logo">🌤️</div>

        <h1>Weather Now</h1>

        <p class="subtitle">Live Weather Information</p>
      </div>

      <!-- Search -->
      <div class="search-box">
        <input
          type="text"
          id="cityInput"
          placeholder="Enter city name..."
          autocomplete="off"
        />

        <button id="searchBtn">🔍 Search</button>
      </div>

      <!-- Loading -->
      <div id="loading">🌦️ Getting weather information...</div>

      <!-- Error -->
      <div id="error"></div>

      <!-- Weather Card -->
      <div id="weatherCard">
        <div class="location" id="location">Bengaluru, IN</div>

        <div class="date" id="date"></div>

        <div class="weather-main">
          <img id="weatherIcon" src="" alt="Weather Icon" />

          <div id="temperature">--°C</div>

          <div id="condition">--</div>
        </div>

        <!-- Information Cards -->
        <div class="weather-info">
          <div class="info-card">
            <div class="info-icon">💧</div>

            <div class="info-title">Humidity</div>

            <div class="info-value" id="humidity">--%</div>
          </div>

          <div class="info-card">
            <div class="info-icon">💨</div>

            <div class="info-title">Wind Speed</div>

            <div class="info-value" id="wind">-- m/s</div>
          </div>
        </div>
      </div>

      <footer>Week 3 JavaScript Project | Keerthi K M</footer>
    </div>

    <script>
      // ==========================================
      // 🔑 ADD YOUR OPENWEATHER API KEY HERE
      // ==========================================

      const API_KEY = "your_api_key_here"; // Replace with your Open

      // Get HTML elements
      const cityInput = document.getElementById("cityInput");
      const searchBtn = document.getElementById("searchBtn");

      const weatherCard = document.getElementById("weatherCard");
      const loading = document.getElementById("loading");
      const errorBox = document.getElementById("error");

      // ==========================================
      // SEARCH BUTTON
      // ==========================================

      searchBtn.addEventListener("click", getWeather);

      // ==========================================
      // ENTER KEY
      // ==========================================

      cityInput.addEventListener("keypress", function (event) {
        if (event.key === "Enter") {
          getWeather();
        }
      });

      // ==========================================
      // WEATHER FUNCTION
      // ==========================================

      async function getWeather() {
        const city = cityInput.value.trim();

        // Check API key
        if (API_KEY === "YOUR_API_KEY_HERE" || API_KEY === "") {
          showError(
            "🔑 Please add your OpenWeather API key in the code first.",
          );

          return;
        }

        // Check city
        if (city === "") {
          showError("🏙️ Please enter a city name.");

          return;
        }

        // Show loading
        loading.style.display = "block";

        weatherCard.style.display = "none";

        errorBox.style.display = "none";

        try {
          // OpenWeather API
          const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric`;

          // Fetch API
          const response = await fetch(url);

          // Convert response to JSON
          const data = await response.json();

          // Check API response
          if (!response.ok) {
            if (response.status === 404) {
              throw new Error("City not found. Please check the city name.");
            }

            if (response.status === 401) {
              throw new Error(
                "Invalid API key. Please check your OpenWeather API key.",
              );
            }

            throw new Error(data.message || "Unable to fetch weather data.");
          }

          // Display weather
          displayWeather(data);
        } catch (error) {
          showError("⚠️ " + error.message);
        } finally {
          loading.style.display = "none";
        }
      }

      // ==========================================
      // DISPLAY WEATHER
      // ==========================================

      function displayWeather(data) {
        const city = data.name;

        const country = data.sys.country;

        const temperature = Math.round(data.main.temp);

        const humidity = data.main.humidity;

        const wind = data.wind.speed;

        const condition = data.weather[0].description;

        const icon = data.weather[0].icon;

        // Location
        document.getElementById("location").textContent = `${city}, ${country}`;

        // Temperature
        document.getElementById("temperature").textContent = `${temperature}°C`;

        // Condition
        document.getElementById("condition").textContent = condition;

        // Humidity
        document.getElementById("humidity").textContent = `${humidity}%`;

        // Wind
        document.getElementById("wind").textContent = `${wind} m/s`;

        // Weather icon
        document.getElementById("weatherIcon").src =
          `https://openweathermap.org/img/wn/${icon}@2x.png`;

        // Current date
        document.getElementById("date").textContent = new Date().toLocaleString(
          "en-IN",
          {
            weekday: "long",
            day: "numeric",
            month: "long",
            year: "numeric",
          },
        );

        // Show card
        weatherCard.style.display = "block";
      }

      // ==========================================
      // ERROR FUNCTION
      // ==========================================

      function showError(message) {
        errorBox.textContent = message;

        errorBox.style.display = "block";

        weatherCard.style.display = "none";

        loading.style.display = "none";
      }
    </script>
  </body>
</html>
